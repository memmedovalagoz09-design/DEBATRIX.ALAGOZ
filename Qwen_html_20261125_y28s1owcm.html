<!DOCTYPE html>
<html lang="az">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DEBATRİX - Debate Arena</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://html2canvas.hertzen.com/dist/html2canvas.min.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Inter', sans-serif; background-color: #F8FAFC; color: #0F172A; }
        .champion-frame { box-shadow: 0 0 0 2px #F8FAFC, 0 0 0 4px #D97706; border-radius: 9999px; }
        .glow-line { background: linear-gradient(to bottom, #2563EB, #7C3AED, #DC2626); box-shadow: 0 0 15px rgba(124, 58, 237, 0.4); }
        .statue-container { position: relative; overflow: hidden; }
        .statue-container::before {
            content: ''; position: absolute; left: 50%; top: 0; bottom: 0; width: 2px;
            background: linear-gradient(to bottom, #2563EB, #7C3AED, #DC2626);
            box-shadow: 0 0 20px rgba(124, 58, 237, 0.6); transform: translateX(-50%); z-index: 10;
        }
        .fade-in { animation: fadeIn 0.3s ease-in-out; }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }
        ::-webkit-scrollbar { width: 6px; }
        ::-webkit-scrollbar-track { background: #F1F5F9; }
        ::-webkit-scrollbar-thumb { background: #CBD5E1; border-radius: 3px; }
        ::-webkit-scrollbar-thumb:hover { background: #94A3B8; }
    </style>
</head>
<body class="min-h-screen flex flex-col">

    <!-- Navbar -->
    <nav class="bg-white border-b border-slate-200 sticky top-0 z-50">
        <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8">
            <div class="flex justify-between h-16">
                <div class="flex items-center cursor-pointer" onclick="App.navigate('home')">
                    <div class="flex flex-col">
                        <span class="text-2xl font-extrabold tracking-tight text-slate-900">DEBATRİX</span>
                        <span class="text-xs font-medium text-slate-500 -mt-1 tracking-widest uppercase">Debate Arena</span>
                    </div>
                </div>
                <div class="hidden md:flex items-center space-x-8">
                    <button onclick="App.navigate('home')" class="text-slate-600 hover:text-blue-600 font-medium transition">Arena</button>
                    <button onclick="App.navigate('topics')" class="text-slate-600 hover:text-blue-600 font-medium transition">Canlı Debatlar</button>
                    <button onclick="App.navigate('league')" class="text-slate-600 hover:text-blue-600 font-medium transition">Universitet Liqası</button>
                    <div id="nav-auth-section"></div>
                </div>
                <div class="md:hidden flex items-center">
                    <button onclick="document.getElementById('mobile-menu').classList.toggle('hidden')" class="text-slate-600">
                        <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 6h16M4 12h16M4 18h16"></path></svg>
                    </button>
                </div>
            </div>
        </div>
        <!-- Mobile Menu -->
        <div id="mobile-menu" class="hidden md:hidden bg-white border-t border-slate-200 p-4 space-y-3">
            <button onclick="App.navigate('home')" class="block w-full text-left text-slate-600 font-medium">Arena</button>
            <button onclick="App.navigate('topics')" class="block w-full text-left text-slate-600 font-medium">Canlı Debatlar</button>
            <button onclick="App.navigate('league')" class="block w-full text-left text-slate-600 font-medium">Universitet Liqası</button>
            <div id="mobile-nav-auth-section"></div>
        </div>
    </nav>

    <!-- Revans Alert (Hidden by default) -->
    <div id="revans-alert" class="hidden bg-amber-50 border-b border-amber-200 text-amber-800 px-4 py-2 text-center text-sm font-medium">
        ⚔️ Rəqibinizdən <strong>Revans dəvəti</strong> var! <button onclick="App.acceptRematch()" class="underline ml-2 hover:text-amber-900">Qəbul et</button>
    </div>

    <!-- Main Content -->
    <main id="app-root" class="flex-grow max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 py-8 w-full fade-in"></main>

    <!-- Footer -->
    <footer class="bg-white border-t border-slate-200 mt-auto">
        <div class="max-w-7xl mx-auto px-4 py-6 text-center">
            <p class="text-xs text-slate-400">
                BUILT BY ALAGOZ MAMMADOVA • 
                <a href="https://instagram.com/web.by.alagoz" target="_blank" rel="noopener noreferrer" class="hover:text-slate-600 underline transition">
                    @web.by.alagoz
                </a>
            </p>
        </div>
    </footer>

    <!-- Modals -->
    <div id="modal-overlay" class="hidden fixed inset-0 bg-black/50 z-50 flex items-center justify-center p-4 backdrop-blur-sm">
        <div id="modal-content" class="bg-white rounded-2xl shadow-xl max-w-lg w-full max-h-[90vh] overflow-y-auto p-6 relative"></div>
    </div>

    <script>
        const App = {
            state: {
                users: JSON.parse(localStorage.getItem('debatrix_users')) || [],
                currentUser: JSON.parse(localStorage.getItem('debatrix_currentUser')) || null,
                debates: JSON.parse(localStorage.getItem('debatrix_debates')) || [],
                topics: JSON.parse(localStorage.getItem('debatrix_topics')) || [],
                spectatorVotes: JSON.parse(localStorage.getItem('debatrix_spectatorVotes')) || {},
                reactions: JSON.parse(localStorage.getItem('debatrix_reactions')) || {},
                qa: JSON.parse(localStorage.getItem('debatrix_qa')) || {}
            },

            universities: ["Mingəçevir Dövlət Universiteti (MDU)", "Bakı Dövlət Universiteti (BDU)", "UNEC", "ADA Universiteti", "Oksford Universiteti", "Qlobal Müstəqil"],
            faculties: ["Təhsil və Filologiya", "İqtisadiyyat və İdarəetmə", "Mühəndislik və İT", "Fəlsəfə və Sosial Elmlər"],
            categories: ["Fəlsəfə və Əxlaq", "Psixologiya və Davranış", "Elm və Gələcək", "Biologiya və Təkamül", "Tanrı, Din və Ruhaniyyət"],

            save() {
                localStorage.setItem('debatrix_users', JSON.stringify(this.state.users));
                localStorage.setItem('debatrix_currentUser', JSON.stringify(this.state.currentUser));
                localStorage.setItem('debatrix_debates', JSON.stringify(this.state.debates));
                localStorage.setItem('debatrix_topics', JSON.stringify(this.state.topics));
                localStorage.setItem('debatrix_spectatorVotes', JSON.stringify(this.state.spectatorVotes));
                localStorage.setItem('debatrix_reactions', JSON.stringify(this.state.reactions));
                localStorage.setItem('debatrix_qa', JSON.stringify(this.state.qa));
            },

            getRank(rix) {
                if (rix >= 2000) return { name: 'Grandmaster', color: 'text-purple-600', bg: 'bg-purple-100 border-purple-200' };
                if (rix >= 1500) return { name: 'Mindshifter', color: 'text-amber-600', bg: 'bg-amber-100 border-amber-200' };
                if (rix >= 1000) return { name: 'Debater', color: 'text-blue-600', bg: 'bg-blue-100 border-blue-200' };
                return { name: 'Rookie', color: 'text-slate-600', bg: 'bg-slate-100 border-slate-200' };
            },

            navigate(view, params = {}) {
                const root = document.getElementById('app-root');
                root.innerHTML = '';
                root.className = 'flex-grow max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 py-8 w-full fade-in';
                this.renderNav();
                
                switch(view) {
                    case 'home': this.renderHome(root); break;
                    case 'auth': this.renderAuth(root); break;
                    case 'topics': this.renderTopics(root); break;
                    case 'league': this.renderLeague(root); break;
                    case 'profile': this.renderProfile(root); break;
                    case 'debate': this.renderDebateRoom(root, params.id); break;
                    default: this.renderHome(root);
                }
                window.scrollTo(0, 0);
            },

            renderNav() {
                const authHTML = this.state.currentUser ? `
                    <div class="flex items-center space-x-4">
                        <div class="text-right hidden lg:block">
                            <div class="text-sm font-bold text-slate-900">${this.state.currentUser.name}</div>
                            <div class="text-xs text-amber-600 font-medium">${this.state.currentUser.rix} RIX • ${this.getRank(this.state.currentUser.rix).name}</div>
                        </div>
                        <button onclick="App.navigate('profile')" class="w-10 h-10 rounded-full bg-slate-100 border border-slate-200 flex items-center justify-center font-bold text-slate-700 ${this.state.currentUser.isChampion ? 'champion-frame' : ''}">
                            ${this.state.currentUser.name.charAt(0).toUpperCase()}
                        </button>
                        <button onclick="App.logout()" class="text-sm text-slate-500 hover:text-red-600">Çıxış</button>
                    </div>
                ` : `
                    <button onclick="App.navigate('auth')" class="bg-slate-900 text-white px-5 py-2 rounded-lg font-medium hover:bg-slate-800 transition">Daxil ol / Qeydiyyat</button>
                `;
                document.getElementById('nav-auth-section').innerHTML = authHTML;
                document.getElementById('mobile-nav-auth-section').innerHTML = authHTML;
            },

            renderHome(root) {
                root.innerHTML = `
                    <div class="text-center max-w-4xl mx-auto py-12">
                        <div class="inline-flex items-center px-3 py-1 rounded-full bg-blue-50 text-blue-700 text-sm font-medium mb-6 border border-blue-100">
                            ✨ İDEYALARIN QLOBAL ARENASI
                        </div>
                        <h1 class="text-5xl md:text-7xl font-extrabold text-slate-900 tracking-tight mb-2">DEBATRİX</h1>
                        <p class="text-xl md:text-2xl text-slate-500 font-medium tracking-widest uppercase mb-4">Debate Arena</p>
                        <p class="text-2xl md:text-3xl font-bold text-transparent bg-clip-text bg-gradient-to-r from-blue-600 via-purple-600 to-red-600 mb-12">
                            "Sadəcə mübahisə etmə, sübut et!"
                        </p>

                        <div class="statue-container bg-white rounded-3xl border border-slate-200 shadow-sm p-8 md:p-12 mb-12 max-w-3xl mx-auto relative">
                            <div class="flex justify-between items-center relative z-20">
                                <div class="text-6xl md:text-8xl grayscale opacity-70 statue-glow">🏛️</div>
                                <div class="text-6xl md:text-8xl grayscale opacity-70 statue-glow scale-x-[-1]">🏛️</div>
                            </div>
                            <div class="absolute inset-0 bg-gradient-to-b from-transparent via-white/50 to-transparent pointer-events-none"></div>
                        </div>

                        <div class="flex flex-col sm:flex-row justify-center gap-4 mb-12">
                            <button onclick="${this.state.currentUser ? "App.navigate('topics')" : "App.navigate('auth')"}" class="bg-blue-600 text-white px-8 py-4 rounded-xl font-bold text-lg hover:bg-blue-700 transition shadow-lg shadow-blue-200 flex items-center justify-center gap-2">
                                Debata Qoşul →
                            </button>
                            <button onclick="App.navigate('topics')" class="bg-white text-slate-700 border border-slate-200 px-8 py-4 rounded-xl font-bold text-lg hover:bg-slate-50 transition flex items-center justify-center gap-2">
                                👁 Canlı Arenaları İzlə
                            </button>
                        </div>

                        <button onclick="App.pickRandomTopic()" class="mb-12 text-sm font-medium text-purple-600 hover:text-purple-800 underline decoration-purple-300 underline-offset-4">
                            🎲 Təsadüfi Mövzu
                        </button>

                        <div class="flex flex-wrap justify-center gap-6 text-sm text-slate-500 font-medium">
                            <span class="flex items-center gap-2"><span class="text-lg">🛡</span> AI Hakimlik</span>
                            <span class="flex items-center gap-2"><span class="text-lg">🌐</span> Qlobal İcma</span>
                            <span class="flex items-center gap-2"><span class="text-lg">🎓</span> Universitet Liqaları</span>
                        </div>
                    </div>
                `;
            },

            renderAuth(root) {
                const isLogin = window.location.hash === '#login';
                root.innerHTML = `
                    <div class="max-w-md mx-auto bg-white rounded-2xl shadow-sm border border-slate-200 p-8">
                        <h2 class="text-2xl font-bold text-slate-900 mb-6 text-center">${isLogin ? 'Giriş' : 'Qeydiyyat'}</h2>
                        <form onsubmit="App.handleAuth(event, ${isLogin})" class="space-y-4">
                            ${!isLogin ? `
                                <div>
                                    <label class="block text-sm font-medium text-slate-700 mb-1">Ad Soyad</label>
                                    <input type="text" name="name" required class="w-full px-4 py-2 rounded-lg border border-slate-300 focus:ring-2 focus:ring-blue-500 focus:border-blue-500 outline-none">
                                </div>
                                <div>
                                    <label class="block text-sm font-medium text-slate-700 mb-1">Universitet</label>
                                    <select name="university" required class="w-full px-4 py-2 rounded-lg border border-slate-300 focus:ring-2 focus:ring-blue-500 outline-none bg-white">
                                        ${this.universities.map(u => `<option value="${u}">${u}</option>`).join('')}
                                    </select>
                                </div>
                                <div>
                                    <label class="block text-sm font-medium text-slate-700 mb-1">Fakültə</label>
                                    <select name="faculty" required class="w-full px-4 py-2 rounded-lg border border-slate-300 focus:ring-2 focus:ring-blue-500 outline-none bg-white">
                                        ${this.faculties.map(f => `<option value="${f}">${f}</option>`).join('')}
                                    </select>
                                </div>
                            ` : ''}
                            <div>
                                <label class="block text-sm font-medium text-slate-700 mb-1">Email</label>
                                <input type="email" name="email" required class="w-full px-4 py-2 rounded-lg border border-slate-300 focus:ring-2 focus:ring-blue-500 outline-none">
                            </div>
                            <div>
                                <label class="block text-sm font-medium text-slate-700 mb-1">Şifrə</label>
                                <input type="password" name="password" required class="w-full px-4 py-2 rounded-lg border border-slate-300 focus:ring-2 focus:ring-blue-500 outline-none">
                            </div>
                            <button type="submit" class="w-full bg-slate-900 text-white py-3 rounded-lg font-bold hover:bg-slate-800 transition">
                                ${isLogin ? 'Daxil ol' : 'Qeydiyyatdan keç və 1000 RIX qazan'}
                            </button>
                        </form>
                        <p class="mt-4 text-center text-sm text-slate-600">
                            ${isLogin ? 'Hesabınız yoxdur?' : 'Artıq hesabınız var?'} 
                            <button onclick="window.location.hash='${isLogin ? '' : 'login'}'; App.navigate('auth')" class="text-blue-600 font-medium hover:underline">
                                ${isLogin ? 'Qeydiyyatdan keç' : 'Giriş et'}
                            </button>
                        </p>
                    </div>
                `;
            },

            handleAuth(e, isLogin) {
                e.preventDefault();
                const formData = new FormData(e.target);
                const email = formData.get('email');
                const password = formData.get('password');

                if (isLogin) {
                    const user = this.state.users.find(u => u.email === email && u.password === password);
                    if (user) {
                        this.state.currentUser = user;
                        this.save();
                        this.navigate('home');
                    } else {
                        alert('Email və ya şifrə yanlışdır!');
                    }
                } else {
                    if (this.state.users.find(u => u.email === email)) {
                        alert('Bu email artıq qeydiyyatdan keçib!');
                        return;
                    }
                    const newUser = {
                        id: Date.now().toString(),
                        name: formData.get('name'),
                        email, password,
                        university: formData.get('university'),
                        faculty: formData.get('faculty'),
                        rix: 1000,
                        debatesCount: 0,
                        isChampion: false,
                        spectatorXP: 0,
                        history: []
                    };
                    this.state.users.push(newUser);
                    this.state.currentUser = newUser;
                    this.save();
                    this.navigate('home');
                }
            },

            logout() {
                this.state.currentUser = null;
                localStorage.removeItem('debatrix_currentUser');
                this.navigate('home');
            },

            renderTopics(root) {
                const activeDebates = this.state.debates.filter(d => d.status !== 'completed');
                root.innerHTML = `
                    <div class="mb-8 flex flex-col md:flex-row md:items-center justify-between gap-4">
                        <div>
                            <h2 class="text-3xl font-bold text-slate-900">Canlı Debatlar</h2>
                            <p class="text-slate-500 mt-1">Mövzuları kəşf et və arenaya qoşul</p>
                        </div>
                        <div class="flex gap-3">
                            <button onclick="App.showCreateTopicModal()" class="px-4 py-2 bg-white border border-slate-200 text-slate-700 rounded-lg font-medium hover:bg-slate-50 transition">
                                + Yeni Mövzu Yarat
                            </button>
                            <button onclick="${this.state.currentUser ? "App.showCreateDebateModal()" : "App.navigate('auth')"}" class="px-4 py-2 bg-blue-600 text-white rounded-lg font-medium hover:bg-blue-700 transition">
                                Debata Başla
                            </button>
                        </div>
                    </div>

                    <div class="mb-6 flex flex-wrap gap-2">
                        ${this.categories.map(cat => `
                            <button onclick="App.filterTopics('${cat}')" class="px-4 py-1.5 rounded-full text-sm font-medium bg-white border border-slate-200 text-slate-600 hover:border-blue-300 hover:text-blue-600 transition category-filter" data-cat="${cat}">
                                ${cat}
                            </button>
                        `).join('')}
                        <button onclick="App.filterTopics('all')" class="px-4 py-1.5 rounded-full text-sm font-medium bg-slate-900 text-white category-filter" data-cat="all">Hamısı</button>
                    </div>

                    <div id="topics-list" class="grid gap-4 md:grid-cols-2 lg:grid-cols-3">
                        ${this.renderDebateCards(activeDebates)}
                    </div>
                `;
            },

            renderDebateCards(debates) {
                if (debates.length === 0) {
                    return `
                        <div class="col-span-full text-center py-16 bg-white rounded-2xl border border-dashed border-slate-300">
                            <div class="text-4xl mb-4">🏛️</div>
                            <h3 class="text-lg font-bold text-slate-900">Hələlik aktiv debat yoxdur.</h3>
                            <p class="text-slate-500 mt-2 mb-6">İlk debatı siz başladın və arenanı qızdırın!</p>
                            <button onclick="${this.state.currentUser ? "App.showCreateDebateModal()" : "App.navigate('auth')"}" class="px-6 py-2 bg-blue-600 text-white rounded-lg font-medium hover:bg-blue-700 transition">
                                Mövzu Seç və Başla
                            </button>
                        </div>
                    `;
                }
                return debates.map(d => {
                    const topic = this.state.topics.find(t => t.id === d.topicId) || { title: 'Naməlum Mövzu', category: 'Ümumi' };
                    return `
                        <div onclick="App.navigate('debate', {id: '${d.id}'})" class="bg-white p-6 rounded-2xl border border-slate-200 shadow-sm hover:shadow-md hover:border-blue-200 transition cursor-pointer group">
                            <div class="flex justify-between items-start mb-4">
                                <span class="px-3 py-1 bg-slate-100 text-slate-600 text-xs font-bold rounded-full">${topic.category}</span>
                                <span class="flex items-center gap-1 text-xs font-medium text-green-600 bg-green-50 px-2 py-1 rounded-full">
                                    <span class="w-2 h-2 bg-green-500 rounded-full animate-pulse"></span> CANLI
                                </span>
                            </div>
                            <h3 class="text-lg font-bold text-slate-900 mb-4 group-hover:text-blue-600 transition line-clamp-2">${topic.title}</h3>
                            <div class="flex items-center justify-between text-sm text-slate-500">
                                <div class="flex items-center gap-2">
                                    <div class="w-6 h-6 rounded-full bg-blue-100 text-blue-700 flex items-center justify-center text-xs font-bold">P</div>
                                    <span>${d.proName || 'Gözlənilir...'}</span>
                                </div>
                                <span class="text-slate-300">vs</span>
                                <div class="flex items-center gap-2">
                                    <span>${d.conName || 'Gözlənilir...'}</span>
                                    <div class="w-6 h-6 rounded-full bg-red-100 text-red-700 flex items-center justify-center text-xs font-bold">C</div>
                                </div>
                            </div>
                            <div class="mt-4 pt-4 border-t border-slate-100 flex justify-between items-center text-xs text-slate-400">
                                <span>👁 ${d.spectators || 0} izləyici</span>
                                <span>Raund ${d.currentRound}/3</span>
                            </div>
                        </div>
                    `;
                }).join('');
            },

            filterTopics(cat) {
                document.querySelectorAll('.category-filter').forEach(btn => {
                    if (btn.dataset.cat === cat) {
                        btn.classList.remove('bg-white', 'text-slate-600', 'border-slate-200');
                        btn.classList.add('bg-slate-900', 'text-white');
                    } else {
                        btn.classList.add('bg-white', 'text-slate-600', 'border-slate-200');
                        btn.classList.remove('bg-slate-900', 'text-white');
                    }
                });
                
                const filtered = cat === 'all' ? this.state.debates.filter(d => d.status !== 'completed') : 
                    this.state.debates.filter(d => {
                        const topic = this.state.topics.find(t => t.id === d.topicId);
                        return topic && topic.category === cat && d.status !== 'completed';
                    });
                document.getElementById('topics-list').innerHTML = this.renderDebateCards(filtered);
            },

            showCreateTopicModal() {
                if (!this.state.currentUser) return this.navigate('auth');
                document.getElementById('modal-overlay').classList.remove('hidden');
                document.getElementById('modal-content').innerHTML = `
                    <h3 class="text-xl font-bold text-slate-900 mb-4">Yeni Mövzu Yarat</h3>
                    <form onsubmit="App.createTopic(event)" class="space-y-4">
                        <div>
                            <label class="block text-sm font-medium text-slate-700 mb-1">Mövzu Başlığı</label>
                            <input type="text" name="title" required class="w-full px-4 py-2 rounded-lg border border-slate-300 focus:ring-2 focus:ring-blue-500 outline-none" placeholder="Məsələn: Süni intellekt insan yaradıcılığını əvəz edə bilərmi?">
                        </div>
                        <div>
                            <label class="block text-sm font-medium text-slate-700 mb-1">Kateqoriya</label>
                            <select name="category" required class="w-full px-4 py-2 rounded-lg border border-slate-300 focus:ring-2 focus:ring-blue-500 outline-none bg-white">
                                ${this.categories.map(c => `<option value="${c}">${c}</option>`).join('')}
                            </select>
                        </div>
                        <div class="flex justify-end gap-3 mt-6">
                            <button type="button" onclick="App.closeModal()" class="px-4 py-2 text-slate-600 hover:bg-slate-100 rounded-lg">Ləğv et</button>
                            <button type="submit" class="px-4 py-2 bg-blue-600 text-white rounded-lg font-medium hover:bg-blue-700">Yarat</button>
                        </div>
                    </form>
                `;
            },

            createTopic(e) {
                e.preventDefault();
                const formData = new FormData(e.target);
                const newTopic = {
                    id: Date.now().toString(),
                    title: formData.get('title'),
                    category: formData.get('category'),
                    createdBy: this.state.currentUser.id
                };
                this.state.topics.push(newTopic);
                this.save();
                this.closeModal();
                this.navigate('topics');
            },

            showCreateDebateModal() {
                if (this.state.topics.length === 0) {

                const newDebate = {
                    id: Date.now().toString(),
                    topicId: formData.get('topicId'),
                    opponentType: formData.get('opponentType'),
                    status: 'round1',
                    currentRound: 1,

                    proId: side === 'pro' ? this.state.currentUser.id : (formData.get('opponentType').startsWith('AI') ? 'ai' : null),
                    conId: side === 'con' ? this.state.currentUser.id : (formData.get('opponentType').startsWith('AI') ? 'ai' : null),
                    proName: side === 'pro' ? this.state.currentUser.name : (formData.get('opponentType').startsWith('AI') ? 'AI Rəqib' : 'Gözlənilir...'),
                    conName: side === 'con' ? this.state.currentUser.name : (formData.get('opponentType').startsWith('AI') ? 'AI Rəqib' : 'Gözlənilir...'),
                    arguments: [],
                    spectators: 1,

            renderDebateRoom(root, debateId) {
                const debate = this.state.debates.find(d => d.id === debateId);
                if (!debate) return this.navigate('topics');
                
                const topic = this.state.topics.find(t => t.id === debate.topicId) || { title: 'Naməlum', category: 'Ümumi' };
                const isSpectator = this.state.currentUser && this.state.currentUser.id !== debate.proId && this.state.currentUser.id !== debate.conId;
                const isMyTurn = !isSpectator && debate.currentTurn === (this.state.currentUser.id === debate.proId ? 'pro' : 'con');
                
                // Timer logic setup
                if (!window.debateTimer) {
                    window.debateTimeLeft = 300; // 5 minutes
                    window.debateTimer = setInterval(() => {
                        window.debateTimeLeft--;
                        const timerEl = document.getElementById('debate-timer');
                        if (timerEl) {
                            const m = Math.floor(window.debateTimeLeft / 60);

                            if (window.debateTimeLeft <= 30) timerEl.classList.add('text-red-600', 'animate-pulse');
                        }
                        if (window.debateTimeLeft <= 0) {
                            this.handleTurnTimeout(debateId);
                        }
                    }, 1000);
                }

                // AI Turn simulation
                if (debate.opponentType.startsWith('AI') && !isSpectator) {
                    const aiIsTurn = (debate.currentTurn === 'pro' && debate.proId === 'ai') || (debate.currentTurn === 'con' && debate.conId === 'ai');
                    if (aiIsTurn && !debate.aiThinking) {
                        debate.aiThinking = true;
                        this.save();
                        setTimeout(() => {
                            const responses = {
                                1: ["Bu mövzuya əsaslanaraq, ilk növbədə qeyd etmək lazımdır ki, məntiqi ardıcıllıq təməl prinsiplərə söykənir. Tarixi faktlar da bunu təsdiqləyir.", "Sizin arqumentiniz səthi görünür. Əsl həqiqət daha dərinlərdə, sistematik təhlildə yatır."],
                                2: ["Sizin təkzibiniz məntiqi xətaya əsaslanır. Mən bu iddianı faktlarla çürüdürəm: tədqiqatlar göstərir ki...", "Bu, klassik 'saman adam' fallasiyasıdır. Mən tam olaraq bunu demədim, mənim əsas vurğulam fərqlidir."],
                                3: ["Yekun olaraq, bütün arqumentlər mənim lehimədir. İzləyici sualına cavab olaraq: bəli, bu, gələcək üçün yeganə doğru yoldur.", "Nəticə aydındır. Məntiq, faktlar və əxlaq mənim mövqeyimi dəstəkləyir. Qalibiyyət ədalətlidir."]
                            };
                            const resp = responses[debate.currentRound][Math.floor(Math.random() * responses[debate.currentRound].length)];
                            this.submitArgument(debateId, debate.currentTurn, resp);
                        }, 4000 + Math.random() * 6000);
                    }
                }

                const votes = this.state.spectatorVotes[debateId] || { pro: 0, con: 0 };
                const totalVotes = votes.pro + votes.con || 1;
                const proPercent = Math.round((votes.pro / totalVotes) * 100);
                const conPercent = 100 - proPercent;

                const roundNames = ["", "Raund 1: Giriş Arqumenti", "Raund 2: Əks-Hücum və Təkzib", "Raund 3: Yekun Söz və İzləyici Sualına Cavab"];

                root.innerHTML = `
                    <div class="max-w-6xl mx-auto">
                        <div class="bg-white rounded-2xl border border-slate-200 shadow-sm p-6 mb-6">
                            <div class="flex flex-col md:flex-row justify-between items-start md:items-center gap-4 mb-4">
                                <div>
                                    <span class="text-xs font-bold text-purple-600 uppercase tracking-wider">${topic.category}</span>
                                    <h2 class="text-2xl font-bold text-slate-900 mt-1">${topic.title}</h2>
                                </div>
                                <div class="flex items-center gap-4 bg-slate-50 px-4 py-2 rounded-xl border border-slate-200">
                                    <span class="text-sm font-medium text-slate-600">${roundNames[debate.currentRound]}</span>
                                    <div class="h-4 w-px bg-slate-300"></div>
                                    <span id="debate-timer" class="text-xl font-mono font-bold text-slate-900">5:00</span>
                                </div>
                            </div>
                            
                            <!-- Mind Shift Bar -->
                            <div class="mt-6">
                                <div class="flex justify-between text-xs font-bold mb-2">
                                    <span class="text-blue-600">RAZISAN (PRO) ${proPercent}%</span>
                                    <span class="text-red-600">RAZI DEYİLSƏN (CON) ${conPercent}%</span>
                                </div>
                                <div class="w-full h-3 bg-slate-200 rounded-full overflow-hidden flex">
                                    <div class="bg-blue-600 transition-all duration-700" style="width: ${proPercent}%"></div>
                                    <div class="bg-red-600 transition-all duration-700" style="width: ${conPercent}%"></div>
                                </div>
                            </div>
                        </div>

                        <div class="grid lg:grid-cols-3 gap-6">
                            <!-- Main Debate Area -->
                            <div class="lg:col-span-2 space-y-6">
                                ${debate.arguments.map((arg, idx) => this.renderArgumentBubble(arg, idx, debateId)).join('')}
                                
                                ${isMyTurn ? `
                                    <div class="bg-white p-6 rounded-2xl border-2 border-blue-200 shadow-sm">
                                        <div class="flex justify-between items-center mb-3">
                                            <span class="text-sm font-bold ${debate.currentTurn === 'pro' ? 'text-blue-600' : 'text-red-600'}">
                                                Sizin Növbəniz (${debate.currentTurn === 'pro' ? 'RAZISAN' : 'RAZI DEYİLSƏN'})
                                            </span>
                                            <span class="text-xs text-slate-500">Maksimum 400 simvol</span>
                                        </div>
                                        <textarea id="arg-input" maxlength="400" rows="4" class="w-full px-4 py-3 rounded-xl border border-slate-300 focus:ring-2 focus:ring-blue-500 outline-none resize-none" placeholder="Arqumentinizi yazın..."></textarea>
                                        <div class="flex justify-between items-center mt-3">
                                            <span id="char-count" class="text-xs text-slate-400">0/400</span>

                                        </div>
                                    </div>
                                ` : ''}

                                ${debate.status === 'completed' ? this.renderVerdict(debateId) : ''}

                            <!-- Spectator Sidebar -->

                                ${isSpectator ? `
                                    <div class="bg-white p-5 rounded-2xl border border-slate-200 shadow-sm">
                                        <h4 class="font-bold text-slate-900 mb-3">Səsvermə</h4>
                                        <div class="grid grid-cols-2 gap-3">
                                            <button onclick="App.vote('${debateId}', 'pro')" class="py-2 bg-blue-50 text-blue-700 rounded-lg font-medium hover:bg-blue-100 transition border border-blue-200">RAZISAN</button>
                                            <button onclick="App.vote('${debateId}', 'con')" class="py-2 bg-red-50 text-red-700 rounded-lg font-medium hover:bg-red-100 transition border border-red-200">RAZI DEYİLSƏN</button>
                                        </div>
                                    </div>
                                ` : ''}

                                <div class="bg-white p-5 rounded-2xl border border-slate-200 shadow-sm">
                                    <h4 class="font-bold text-slate-900 mb-3">Reaksiyalar</h4>
                                    <div class="flex flex-wrap gap-2">
                                        ${['💡 Güclü Fakt', '⚠️ Məntiq Xətası', '❤️ Emosional', '🌀 Mövzudan Yayındı'].map(r => `
                                            <button onclick="App.addReaction('${debateId}', '${r}')" class="text-xs px-3 py-1.5 bg-slate-100 hover:bg-slate-200 rounded-full text-slate-700 transition">${r}</button>
                                        `).join('')}
                                    </div>
                                </div>

                                <div class="bg-white p-5 rounded-2xl border border-slate-200 shadow-sm">
                                    <h4 class="font-bold text-slate-900 mb-3">İzləyici Sualları (Q&A)</h4>
                                    ${isSpectator ? `
                                        <form onsubmit="App.addQuestion(event, '${debateId}')" class="mb-4">
                                            <input type="text" name="q" required maxlength="150" class="w-full px-3 py-2 text-sm rounded-lg border border-slate-300 focus:ring-2 focus:ring-purple-500 outline-none" placeholder="Sualınızı yazın...">
                                        </form>
                                    ` : ''}
                                    <div class="space-y-3 max-h-64 overflow-y-auto">
                                        ${(this.state.qa[debateId] || []).sort((a,b) => b.upvotes - a.upvotes).map(q => `
                                            <div class="p-3 bg-slate-50 rounded-lg border border-slate-100">
                                                <p class="text-sm text-slate-800 mb-2">${q.text}</p>
                                                <button onclick="App.upvoteQuestion('${debateId}', '${q.id}')" class="text-xs flex items-center gap-1 text-purple-600 hover:text-purple-800 font-medium">
                                                    <span>▲</span> ${q.upvotes} səs
                                                    ${debate.currentRound === 3 && q.isTop ? '<span class="ml-2 text-amber-600 font-bold">⭐ Final Sualı</span>' : ''}
                                                </button>
                                            </div>
                                        `).join('') || '<p class="text-sm text-slate-400 italic">Hələlik sual yoxdur.</p>'}
                                    </div>
                                </div>
                            </div>
                        </div>
                    </div>
                `;

                // Attach char counter listener
                const textarea = document.getElementById('arg-input');
                if (textarea) {
                    textarea.addEventListener('input', (e) => {
                        document.getElementById('char-count').textContent = `${e.target.value.length}/400`;
                    });
                }
            },

            renderArgumentBubble(arg, idx, debateId) {
                const isPro = arg.side === 'pro';
                const colorClass = isPro ? 'bg-blue-50 border-blue-200' : 'bg-red-50 border-red-200';
                const textColor = isPro ? 'text-blue-900' : 'text-red-900';
                const reactions = (this.state.reactions[debateId] || []).filter(r => r.argIdx === idx);
                
                return `
                    <div class="bg-white p-6 rounded-2xl border border-slate-200 shadow-sm relative group">
                        <div class="flex justify-between items-start mb-3">
                            <div class="flex items-center gap-3">
                                <div class="w-8 h-8 rounded-full ${isPro ? 'bg-blue-600' : 'bg-red-600'} text-white flex items-center justify-center font-bold text-sm">
                                    ${isPro ? 'P' : 'C'}
                                </div>
                                <div>
                                    <div class="font-bold text-slate-900 text-sm">${arg.author}</div>
                                    <div class="text-xs text-slate-500">Raund ${arg.round}</div>
                                </div>
                            </div>
                            <button onclick="App.toggleTranslate(this)" class="text-xs text-slate-400 hover:text-slate-600 flex items-center gap-1">
                                🌐 AI Tərcümə
                            </button>
                        </div>
                        <p class="text-slate-800 leading-relaxed mb-4 original-text">${arg.text}</p>
                        <p class="text-slate-500 text-sm italic hidden translated-text border-t border-slate-200 pt-3 mt-3">
                            [AI Translation]: ${arg.text} (This is a simulated translation for demonstration)
                        </p>
                        
                        ${reactions.length > 0 ? `
                            <div class="flex flex-wrap gap-2 mt-3 pt-3 border-t border-slate-100">
                                ${reactions.map(r => `<span class="text-xs px-2 py-1 bg-white border border-slate-200 rounded-full text-slate-600">${r.type}</span>`).join('')}
                            </div>
                        ` : ''}
                    </div>
                `;
            },

            toggleTranslate(btn) {
                const container = btn.closest('.group');
                const orig = container.querySelector('.original-text');
                const trans = container.querySelector('.translated-text');
                if (trans.classList.contains('hidden')) {
                    trans.classList.remove('hidden');
                    orig.classList.add('hidden');
                    btn.classList.add('text-purple-600');
                } else {
                    trans.classList.add('hidden');
                    orig.classList.remove('hidden');
                    btn.classList.remove('text-purple-600');
                }
            },

            submitArgumentFromUI(debateId) {
                const text = document.getElementById('arg-input').value.trim();
                if (!text) return alert('Zəhmət olmasa arqument yazın!');
                this.submitArgument(debateId, this.state.currentUser.id === this.state.debates.find(d => d.id === debateId).proId ? 'pro' : 'con', text);
            },

            submitArgument(debateId, side, text) {
                const debate = this.state.debates.find(d => d.id === debateId);
                if (!debate) return;

                debate.arguments.push({
                    round: debate.currentRound,
                    side: side,
                    author: side === 'pro' ? debate.proName : debate.conName,
                    text: text,
                    timestamp: Date.now()
                });

                // Switch turn
                debate.currentTurn = side === 'pro' ? 'con' : 'pro';
                debate.aiThinking = false;

                // Check if round is complete (both sides have argued in current round)
                const roundArgs = debate.arguments.filter(a => a.round === debate.currentRound);
                if (roundArgs.length >= 2 || (debate.opponentType.startsWith('AI') && roundArgs.length >= 1 && debate.currentTurn === (debate.proId === 'ai' ? 'pro' : 'con'))) {
                    if (debate.currentRound < 3) {
                        debate.currentRound++;
                        debate.currentTurn = 'pro'; // Pro always starts new round
                    } else {
                        debate.status = 'completed';
                        this.calculateVerdict(debateId);
                    }
                }

                window.debateTimeLeft = 300; // Reset timer
                this.save();
                this.navigate('debate', { id: debateId });
            },

            handleTurnTimeout(debateId) {
                const debate = this.state.debates.find(d => d.id === debateId);
                if (!debate || debate.status === 'completed') return;
                
                // Auto-submit empty argument
                this.submitArgument(debateId, debate.currentTurn, "[Vaxt bitdiyi üçün arqument təqdim edilmədi]");
            },

            vote(debateId, side) {
                if (!this.state.currentUser) return this.navigate('auth');
                const votes = this.state.spectatorVotes[debateId];
                votes[side]++;
                this.save();
                this.navigate('debate', { id: debateId });
            },

            addReaction(debateId, type) {
                if (!this.state.reactions[debateId]) this.state.reactions[debateId] = [];
                // For simplicity, attach to last argument or just general
                const lastArgIdx = this.state.debates.find(d => d.id === debateId).arguments.length - 1;
                this.state.reactions[debateId].push({
                    argIdx: lastArgIdx >= 0 ? lastArgIdx : 0,
                    type: type,
                    user: this.state.currentUser.name
                });
                this.save();
                this.navigate('debate', { id: debateId });
            },

            addQuestion(e, debateId) {
                e.preventDefault();
                const text = new FormData(e.target).get('q');
                if (!this.state.qa[debateId]) this.state.qa[debateId] = [];
                this.state.qa[debateId].push({
                    id: Date.now().toString(),
                    text: text,
                    upvotes: 1,
                    isTop: false
                });
                this.save();
                this.navigate('debate', { id: debateId });
            },

            upvoteQuestion(debateId, qId) {
                const qa = this.state.qa[debateId] || [];
                const q = qa.find(x => x.id === qId);
                if (q) {
                    q.upvotes++;
                    // Mark top question for round 3
                    if (qa.length > 0) {
                        qa.forEach(x => x.isTop = false);
                        qa.sort((a, b) => b.upvotes - a.upvotes)[0].isTop = true;
                    }
                    this.save();
                    this.navigate('debate', { id: debateId });
                }
            },

            calculateVerdict(debateId) {
                const debate = this.state.debates.find(d => d.id === debateId);
                const votes = this.state.spectatorVotes[debateId];
                const totalVotes = votes.pro + votes.con || 1;
                
                // Simulate AI Judge scores (0-100)
                const proScore = Math.floor(70 + Math.random() * 25);
                const conScore = Math.floor(70 + Math.random() * 25);
                
                const proVotePercent = votes.pro / totalVotes;
                const conVotePercent = votes.con / totalVotes;
                
                const proFinal = (proScore * 0.5) + (proVotePercent * 100 * 0.5);
                const conFinal = (conScore * 0.5) + (conVotePercent * 100 * 0.5);
                
                const winner = proFinal > conFinal ? 'pro' : 'con';
                const winnerName = winner === 'pro' ? debate.proName : debate.conName;
                const loserId = winner === 'pro' ? debate.conId : debate.proId;
                const winnerId = winner === 'pro' ? debate.proId : debate.conId;

                // Update RIX
                if (winnerId !== 'ai' && this.state.currentUser && this.state.currentUser.id === winnerId) {
                    this.state.currentUser.rix += 150;
                    this.state.currentUser.debatesCount++;
                } else if (loserId !== 'ai' && this.state.currentUser && this.state.currentUser.id === loserId) {
                    this.state.currentUser.rix = Math.max(0, this.state.currentUser.rix - 50);
                    this.state.currentUser.debatesCount++;
                }

                // Award spectator XP
                if (this.state.currentUser) {
                    const userVotedPro = votes.pro > votes.con; // Simplified logic
                    const userVotedWinner = (winner === 'pro' && userVotedPro) || (winner === 'con' && !userVotedPro);
                    if (userVotedWinner && totalVotes > 1) {
                        this.state.currentUser.spectatorXP = (this.state.currentUser.spectatorXP || 0) + 10;
                    }
                }

                debate.verdict = {
                    proScore, conScore, proFinal: Math.round(proFinal), conFinal: Math.round(conFinal),
                    winner, winnerName,
                    fallacies: ["Saman adam fallasiyası", "Sürüşkən yamac"]
                };

                this.save();
            },

            renderVerdict(debateId) {
                const debate = this.state.debates.find(d => d.id === debateId);
                const v = debate.verdict;
                const isWinner = this.state.currentUser && (this.state.currentUser.id === (v.winner === 'pro' ? debate.proId : debate.conId));
                
                return `
                    <div id="verdict-card" class="bg-white p-8 rounded-2xl border-2 border-purple-200 shadow-lg text-center relative overflow-hidden">
                        <div class="absolute top-0 left-0 w-full h-2 bg-gradient-to-r from-blue-500 via-purple-500 to-red-500"></div>
                        <div class="text-4xl mb-4">🏆</div>
                        <h3 class="text-2xl font-bold text-slate-900 mb-2">AI Hakim Qərarı</h3>
                        <p class="text-lg text-purple-600 font-bold mb-6">Qalib: ${v.winnerName}</p>
                        
                        <div class="grid grid-cols-2 gap-4 mb-6 text-left">
                            <div class="bg-blue-50 p-4 rounded-xl border border-blue-100">
                                <div class="text-sm text-blue-600 font-bold mb-1">RAZISAN (PRO)</div>
                                <div class="text-2xl font-bold text-slate-900">${v.proFinal}%</div>
                                <div class="text-xs text-slate-500 mt-1">AI: ${v.proScore}% • İzləyici: ${Math.round((this.state.spectatorVotes[debateId].pro / (this.state.spectatorVotes[debateId].pro + this.state.spectatorVotes[debateId].con || 1)) * 100)}%</div>
                            </div>
                            <div class="bg-red-50 p-4 rounded-xl border border-red-100">
                                <div class="text-sm text-red-600 font-bold mb-1">RAZI DEYİLSƏN (CON)</div>
                                <div class="text-2xl font-bold text-slate-900">${v.conFinal}%</div>
                                <div class="text-xs text-slate-500 mt-1">AI: ${v.conScore}% • İzləyici: ${Math.round((this.state.spectatorVotes[debateId].con / (this.state.spectatorVotes[debateId].pro + this.state.spectatorVotes[debateId].con || 1)) * 100)}%</div>
                            </div>
                        </div>

                        <div class="bg-amber-50 border border-amber-200 rounded-xl p-4 mb-6 text-left">
                            <div class="font-bold text-amber-800 mb-2 text-sm">🔍 Aşkarlanan Məntiqi Xətalar:</div>
                            <ul class="text-sm text-amber-900 list-disc list-inside">
                                ${v.fallacies.map(f => `<li>${f}</li>`).join('')}
                            </ul>
                        </div>

                        ${isWinner ? `<div class="text-green-600 font-bold mb-4">+150 RIX qazandınız!</div>` : ''}
                        ${this.state.currentUser && this.state.currentUser.spectatorXP > 0 ? `<div class="text-purple-600 font-bold mb-4 text-sm">+10 Obyektiv Hakim XP qazandınız!</div>` : ''}

                        <div class="flex justify-center gap-3 mt-6">
                            <button onclick="App.downloadVerdict()" class="px-4 py-2 bg-slate-900 text-white rounded-lg font-medium hover:bg-slate-800 transition flex items-center gap-2">
                                📥 Şəkil olaraq yüklə
                            </button>
                            <button onclick="App.requestRematch('${debateId}')" class="px-4 py-2 bg-white border border-slate-200 text-slate-700 rounded-lg font-medium hover:bg-slate-50 transition">
                                ⚔️ Revans istə
                            </button>
                        </div>
                    </div>
                `;
            },

            downloadVerdict() {
                const card = document.getElementById('verdict-card');
                html2canvas(card, { backgroundColor: '#ffffff', scale: 2 }).then(canvas => {
                    const link = document.createElement('a');
                    link.download = 'debatrix-verdict.png';
                    link.href = canvas.toDataURL();
                    link.click();
                });
            },

            requestRematch(debateId) {
                alert('Revans dəvəti göndərildi! Rəqib qəbul etdikdən sonra yeni debat başlayacaq.');
                document.getElementById('revans-alert').classList.remove('hidden');
            },

            acceptRematch() {
                document.getElementById('revans-alert').classList.add('hidden');
                this.showCreateDebateModal();
            },

            renderLeague(root) {
                const sortedUsers = [...this.state.users].sort((a, b) => b.rix - a.rix);
                
                root.innerHTML = `
                    <div class="mb-8">
                        <h2 class="text-3xl font-bold text-slate-900">Universitet Liqası</h2>
                        <p class="text-slate-500 mt-1">Real vaxt rejimində RIX reytinqi və Debat statistikası</p>
                    </div>

                    ${sortedUsers.length === 0 ? `
                        <div class="text-center py-16 bg-white rounded-2xl border border-dashed border-slate-300">
                            <h3 class="text-lg font-bold text-slate-900">Reytinq cədvəli boşdur.</h3>
                            <p class="text-slate-500 mt-2 mb-6">Qeydiyyatdan keçin və RIX qazanın!</p>
                            <button onclick="App.navigate('auth')" class="px-6 py-2 bg-blue-600 text-white rounded-lg font-medium hover:bg-blue-700 transition">Qeydiyyatdan keç</button>
                        </div>
                    ` : `
                        <div class="grid md:grid-cols-3 gap-6 mb-8">
                            <div class="bg-gradient-to-br from-amber-50 to-white p-6 rounded-2xl border border-amber-200">
                                <div class="text-amber-600 font-bold text-sm uppercase mb-2">🏆 MDU Həftəlik Kuboku</div>
                                <div class="text-2xl font-bold text-slate-900">
                                    ${sortedUsers.filter(u => u.university.includes('MDU'))[0]?.name || 'Hələlik yoxdur'}
                                </div>
                                <div class="text-sm text-slate-500 mt-1">${sortedUsers.filter(u => u.university.includes('MDU'))[0]?.rix || 0} RIX</div>
                            </div>
                            <div class="bg-white p-6 rounded-2xl border border-slate-200">
                                <div class="text-purple-600 font-bold text-sm uppercase mb-2">🎓 Fakültə Kuboku Lideri</div>
                                <div class="text-2xl font-bold text-slate-900">
                                    ${sortedUsers[0]?.name || 'Hələlik yoxdur'}
                                </div>
                                <div class="text-sm text-slate-500 mt-1">${sortedUsers[0]?.faculty || '-'}</div>
                            </div>
                            <div class="bg-white p-6 rounded-2xl border border-slate-200">
                                <div class="text-blue-600 font-bold text-sm uppercase mb-2">🔥 Ən Aktiv Debatçı</div>
                                <div class="text-2xl font-bold text-slate-900">
                                    ${[...sortedUsers].sort((a,b) => b.debatesCount - a.debatesCount)[0]?.name || 'Hələlik yoxdur'}
                                </div>
                                <div class="text-sm text-slate-500 mt-1">${[...sortedUsers].sort((a,b) => b.debatesCount - a.debatesCount)[0]?.debatesCount || 0} Debat</div>
                            </div>
                        </div>

                        <div class="bg-white rounded-2xl border border-slate-200 overflow-hidden">
                            <table class="w-full text-left">
                                <thead class="bg-slate-50 border-b border-slate-200">
                                    <tr>
                                        <th class="px-6 py-4 text-xs font-bold text-slate-500 uppercase">Sıra</th>
                                        <th class="px-6 py-4 text-xs font-bold text-slate-500 uppercase">İstifadəçi</th>
                                        <th class="px-6 py-4 text-xs font-bold text-slate-500 uppercase">Universitet / Fakültə</th>
                                        <th class="px-6 py-4 text-xs font-bold text-slate-500 uppercase text-right">RIX</th>
                                        <th class="px-6 py-4 text-xs font-bold text-slate-500 uppercase text-right">Debat Sayı</th>
                                    </tr>
                                </thead>
                                <tbody class="divide-y divide-slate-100">
                                    ${sortedUsers.map((u, idx) => {
                                        const rank = this.getRank(u.rix);
                                        return `
                                            <tr class="hover:bg-slate-50 transition">
                                                <td class="px-6 py-4 font-bold text-slate-400">#${idx + 1}</td>
                                                <td class="px-6 py-4">
                                                    <div class="flex items-center gap-3">
                                                        <div class="w-10 h-10 rounded-full bg-slate-100 border border-slate-200 flex items-center justify-center font-bold text-slate-700 ${u.isChampion ? 'champion-frame' : ''}">
                                                            ${u.name.charAt(0).toUpperCase()}
                                                        </div>
                                                        <div>
                                                            <div class="font-bold text-slate-900 flex items-center gap-2">
                                                                ${u.name}
                                                                ${u.isChampion ? '<span class="text-amber-500 text-sm">🏆</span>' : ''}
                                                            </div>
                                                            <span class="inline-block mt-1 px-2 py-0.5 rounded text-xs font-bold border ${rank.bg} ${rank.color}">${rank.name}</span>
                                                        </div>
                                                    </div>
                                                </td>
                                                <td class="px-6 py-4 text-sm text-slate-600">
                                                    <div class="font-medium">${u.university}</div>
                                                    <div class="text-slate-400 text-xs">${u.faculty}</div>
                                                </td>
                                                <td class="px-6 py-4 text-right font-bold text-amber-600">${u.rix}</td>
                                                <td class="px-6 py-4 text-right text-slate-600">${u.debatesCount}</td>
                                            </tr>
                                        `;
                                    }).join('')}
                                </tbody>
                            </table>
                        </div>
                    `}
                `;
            },

            renderProfile(root) {
                if (!this.state.currentUser) return this.navigate('auth');
                const u = this.state.currentUser;
                const rank = this.getRank(u.rix);
                
                root.innerHTML = `
                    <div class="max-w-2xl mx-auto">
                        <div class="bg-white rounded-2xl border border-slate-200 shadow-sm p-8 text-center mb-6">
                            <div class="w-24 h-24 mx-auto rounded-full bg-slate-100 border-2 border-slate-200 flex items-center justify-center text-3xl font-bold text-slate-700 mb-4 ${u.isChampion ? 'champion-frame' : ''}">
                                ${u.name.charAt(0).toUpperCase()}
                            </div>
                            <h2 class="text-2xl font-bold text-slate-900">${u.name}</h2>
                            <p class="text-slate-500">${u.university} • ${u.faculty}</p>
                            
                            <div class="flex justify-center gap-4 mt-6">
                                <div class="bg-amber-50 px-6 py-3 rounded-xl border border-amber-200">
                                    <div class="text-2xl font-bold text-amber-600">${u.rix}</div>
                                    <div class="text-xs text-amber-800 font-medium uppercase">RIX Balansı</div>
                                </div>
                                <div class="bg-purple-50 px-6 py-3 rounded-xl border border-purple-200">
                                    <div class="text-2xl font-bold text-purple-600">${u.spectatorXP || 0}</div>
                                    <div class="text-xs text-purple-800 font-medium uppercase">Hakim XP</div>
                                </div>
                            </div>
                            
                            <div class="mt-6 inline-block px-4 py-2 rounded-full text-sm font-bold border ${rank.bg} ${rank.color}">
                                Rank: ${rank.name}
                            </div>
                        </div>

                        <div class="bg-white rounded-2xl border border-slate-200 shadow-sm p-6">
                            <h3 class="font-bold text-slate-900 mb-4">Debat Tarixçəsi</h3>
                            ${u.history.length === 0 ? '<p class="text-slate-500 text-sm italic">Hələlik debat tarixçəsi yoxdur.</p>' : 
                              u.history.map(h => `<div class="py-3 border-b border-slate-100 last:border-0 text-sm"><span class="font-medium">${h.topic}</span> - <span class="${h.result === 'win' ? 'text-green-600' : 'text-red-600'}">${h.result === 'win' ? 'Qələbə' : 'Məğlubiyyət'}</span></div>`).join('')}
                        </div>
                    </div>
                `;
            },

            pickRandomTopic() {
                if (this.state.topics.length === 0) {
                    alert('Əvvəlcə yeni mövzu yaradın!');
                    return this.showCreateTopicModal();
                }
                const random = this.state.topics[Math.floor(Math.random() * this.state.topics.length)];
                alert(`Təsadüfi Mövzu: ${random.title}\n\nİndi "Debata Qoşul" düyməsini sıxaraq bu mövzuda debat aça bilərsiniz.`);
            },

            closeModal() {
                document.getElementById('modal-overlay').classList.add('hidden');
            }
        };

        // Initialize
        window.addEventListener('DOMContentLoaded', () => {
            App.navigate('home');
        });

        // Close modal on outside click
        document.getElementById('modal-overlay').addEventListener('click', (e) => {
            if (e.target.id === 'modal-overlay') App.closeModal();
        });
    </script>
</body>
</html>
